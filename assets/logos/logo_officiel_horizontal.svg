<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180">
  <defs>
    <linearGradient id="goldHoriz" x1="0" y1="0" x2="700" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fae8b6"/>
      <stop offset="30%" stop-color="#d8b247"/>
      <stop offset="70%" stop-color="#c49c3e"/>
      <stop offset="100%" stop-color="#9e792a"/>
    </linearGradient>
  </defs>

  <!-- Authentic Emblem -->
  <g transform="translate(20, 7) scale(0.85)" stroke="url(#goldHoriz)" fill="none">
    <!-- Chimney -->
    <path d="M 65 35 L 65 21 L 73 21 L 73 31" stroke-width="3.8" stroke-linecap="butt"/>
    <!-- Roof Gable -->
    <polyline points="54,39 110,11 166,39" stroke-width="4.8" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- P Stem -->
    <path d="M 26 39 L 26 165" stroke-width="4.8" stroke-linecap="square"/>
    <!-- P Bowl -->
    <path d="M 26 39 L 58 39 C 90 39 90 101 58 101 L 26 101" stroke-width="4.8" stroke-linejoin="miter"/>
    <!-- W Left V -->
    <polyline points="58,39 112,165 166,39" stroke-width="4.8" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- W Right V -->
    <polyline points="102,39 156,165 210,39" stroke-width="4.8" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(240, 75)">
    <text x="0" y="16" fill="#FFFFFF" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="300" letter-spacing="9">PLUG AND WORK</text>
    <text x="3" y="54" fill="url(#goldHoriz)" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="16">AGENCY</text>
  </g>
</svg>