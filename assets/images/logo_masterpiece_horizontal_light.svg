<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="navGold" x1="0" y1="0" x2="850" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fae8b6"/>
      <stop offset="30%" stop-color="#d8b247"/>
      <stop offset="70%" stop-color="#c49c3e"/>
      <stop offset="100%" stop-color="#9e792a"/>
    </linearGradient>
  </defs>

  <!-- Authentic House Roof PW Emblem -->
  <g transform="translate(30, 16) scale(0.85)" stroke="url(#navGold)" fill="none">
    <!-- Chimney -->
    <path d="M 65 35 L 65 21 L 73 21 L 73 31" stroke-width="3.6" stroke-linecap="butt"/>
    <!-- Roof Gable -->
    <polyline points="54,39 110,11 166,39" stroke-width="4.8" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- P Stem -->
    <path d="M 26 39 L 26 165" stroke-width="4.8" stroke-linecap="square"/>
    <!-- P Bowl -->
    <path d="M 26 39 L 58 39 C 90 39 90 101 58 101 L 26 101" stroke-width="4.8"/>
    <!-- W Left V -->
    <polyline points="58,39 112,165 166,39" stroke-width="4.8" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- W Right V -->
    <polyline points="102,39 156,165 210,39" stroke-width="4.8" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(245, 78)">
    <text x="0" y="16" fill="#FFFFFF" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="36" font-weight="300" letter-spacing="10">PLUG AND WORK</text>
    <text x="2" y="55" fill="url(#navGold)" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="17">AGENCY</text>
  </g>
</svg>